# Typy backendu mock (mypy). Uruchomienie: `cd mock_backend && python -m mypy`.
[mypy]
python_version = 3.12
check_untyped_defs = True
# Poza zakresem bramki:
#  * tests/ — testy bez adnotacji (konwencja projektu); pytest je i tak uruchamia. Katalog bez
#    __init__.py dałby "Source file found twice" dla golden_cases.
#  * tunnel/sync_agent_tools.py, tunnel/run_simulations.py — uruchamiane jako skrypty, importują
#    `_http` i `tool_schemas` jako moduły najwyższego poziomu w gałęzi `except ImportError`.
#    Ten sam plik ma wtedy dwie nazwy modułu i mypy odmawia. Sprawdzane osobno w płaskiej kopii.
exclude = (?x)(^tests/ | ^tunnel/(sync_agent_tools|run_simulations)\.py$ | __pycache__)
