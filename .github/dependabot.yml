# Dependency update PRs, weekly. Versions in the repo stay pinned; Dependabot proposes the bumps.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/mock_backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
