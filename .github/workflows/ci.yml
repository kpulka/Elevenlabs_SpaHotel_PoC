name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The single Python version of the project. The backend image (mock_backend/Dockerfile) uses python:3.12-slim.
  PYTHON_VERSION: "3.12"

jobs:
  backend:
    name: backend (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            mock_backend/requirements.txt
            mock_backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mock_backend/requirements.txt -r mock_backend/requirements-dev.txt

      # Coverage gate. Needs pytest-cov in mock_backend/requirements-dev.txt; the threshold is
      # enforced by --cov-fail-under and the report is printed in the job log.
      - name: Run tests with coverage (fail under 80 %)
        working-directory: mock_backend
        run: python -m pytest --cov=. --cov-fail-under=80 --cov-report=term-missing -q

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Pinned: a newer ruff can add rules and break a green main without any code change.
      - name: Install ruff
        run: pip install ruff==0.17.4

      - name: Ruff check (mock_backend/ruff.toml)
        run: ruff check mock_backend

  types:
    name: types (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            mock_backend/requirements.txt
            mock_backend/requirements-dev.txt

      # mypy reads the imports of installed libraries (fastapi, pydantic), so it needs the runtime.
      - name: Install dependencies
        run: pip install -r mock_backend/requirements-dev.txt

      - name: Mypy (mock_backend/mypy.ini)
        working-directory: mock_backend
        run: python -m mypy .

  # Repository gates that need no dependencies. Each script is also runnable locally.
  repo-gates:
    name: repo gates (scripts, deck, docs index)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Figures must agree across the deck, the HTML decks, the spec files and the business case.
      - name: Deck figures agree across artifacts
        run: python presentation/verify_deck.py

      # Every docs/*.md is listed in docs/INDEX.md and every .md the index points to exists.
      - name: docs/INDEX.md matches docs/
        run: python docs/verify_index.py

      # Agent knowledge base and the uploaded copy must have the same keys and facts.
      - name: Knowledge base parity (source vs uploaded .txt)
        run: python scripts/check_kb_parity.py

      # Prompt and knowledge base must not quote facts (amounts, hours, service names) that are missing from the KB.
      - name: Prompt / procedures vs knowledge base (grounding lint)
        if: hashFiles('scripts/lint_prompt_kb.py') != ''
        run: python scripts/lint_prompt_kb.py

      # Tool names and body fields in the prompt, the agent config and mock_backend/tunnel/tool_schemas.py agree.
      - name: Tool contract (prompt / config / backend schemas)
        if: hashFiles('scripts/check_tool_contract.py') != ''
        run: python scripts/check_tool_contract.py

  # Backend image: builds, starts and answers /health.
  docker-build:
    name: docker (build + health)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The build context is mock_backend/ (COPY paths in the Dockerfile are relative to it).
      - name: Build image
        run: docker build -t bukowy-dwor-backend -f mock_backend/Dockerfile mock_backend

      - name: Start container
        run: docker run -d --name bukowy-dwor-backend -p 8011:8011 bukowy-dwor-backend

      # The container may need a moment to start uvicorn: retry /health for about 20 s.
      - name: Wait for /health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8011/health; then
              echo "health OK after ${i} s"
              exit 0
            fi
            sleep 1
          done
          echo "No answer from /health after 20 s; container logs:"
          docker logs bukowy-dwor-backend
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f bukowy-dwor-backend || true

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      # ESLint with eslint-config-next, errors only (the lint script runs with --quiet).
      - name: Lint (ESLint)
        working-directory: frontend
        run: pnpm lint

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: pnpm test

      # Drift gates: the site must not quote a price the backend disagrees with,
      # and no PL/EN key may go missing.
      - name: PL/EN dictionary parity
        working-directory: frontend
        run: pnpm i18n:check

      - name: Generated hotel data is up to date
        working-directory: frontend
        run: pnpm data:check

      - name: Build
        working-directory: frontend
        run: pnpm build

  # Browser smoke test (Playwright). Runs only when the frontend Playwright config exists, so this job is
  # a no-op on any branch that does not have it yet. Kept separate so a browser install does not slow the rest.
  e2e:
    name: frontend e2e (Playwright, chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Playwright config
        id: detect
        run: |
          if [ -f frontend/playwright.config.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "frontend/playwright.config.ts not found, skipping e2e"
          fi

      - name: Set up pnpm
        if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node 22
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium with system dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Build frontend
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: pnpm build

      - name: Run e2e tests
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: pnpm test:e2e

  # Dependency audits. Advisory for now: findings are printed but do not fail the build.
  # Move to blocking once the baseline is clean.
  audit:
    name: dependency audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-audit (backend runtime requirements)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r mock_backend/requirements.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm audit (production dependencies)
        continue-on-error: true
        working-directory: frontend
        run: pnpm audit --prod --audit-level=high

  # Secret scanning over the full history (a fresh clone must be clean, not only the tip).
  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
