name: Pages

# Publishes presentation/ (the bilingual case-study deck) as the project page.
# No build step: the deck is static HTML with local assets, so the artifact is
# the directory itself. PPTX binaries stay in the release assets.

on:
  push:
    branches: [main]
    paths:
      - "presentation/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy presentation/
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: presentation

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
